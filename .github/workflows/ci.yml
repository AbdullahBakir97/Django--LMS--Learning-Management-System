name: CI

on:
  push:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lms" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Django system checks
        run: python manage.py check
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: API schema has no warnings
        run: python manage.py spectacular --fail-on-warn --file /dev/null
      - name: Production settings pass the deployment checklist
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-deploy-check-key-that-is-long-and-random-enough-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: lms.example.com
        run: python manage.py check --deploy --fail-level WARNING
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint && pnpm format:check
      - name: Type-check
        run: pnpm type-check
      - name: Unit tests
        run: pnpm test:unit --run
      - name: Build
        run: pnpm build-only
      - name: Browser smoke test
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e

  e2e:
    # The main journeys in a real browser against a real, seeded backend.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lms
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lms" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_SETTINGS_MODULE: config.settings.local
      POSTGRES_HOST: 127.0.0.1
      DEMO_PASSWORD: ci-demo-password-1
      THROTTLE_AUTH: 1000/min # the journeys sign in more often than a person would
      E2E_BACKEND: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Backend up with demo data
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py runserver 8000 > ../runserver.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8000/api/health/ && break; sleep 1; done
      - name: Journeys
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Server log on failure
        if: failure()
        run: cat runserver.log

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Backend image builds
        run: docker build -t lms-backend:ci backend
      - name: Frontend image builds
        run: docker build -t lms-web:ci frontend
      - name: Backend image runs as a non-root user
        run: test "$(docker run --rm lms-backend:ci id -u)" != "0"
