<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS System Architecture</title>
  <meta name="description" content="Target system architecture of the Django LMS: Vue client, Nginx edge, Django REST and WebSocket platform, domain services, workers and data stores.">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .frame { max-width: 1320px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    p.lede {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Django LMS</p>
    <h1>Django LMS, the whole system</h1>
    <p class="lede">One request path, one event path: the SPA talks REST for data and WebSocket for live updates; every write lands in PostgreSQL and fans out through Redis.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lms-arch-title lms-arch-desc">
        <title id="lms-arch-title">Django LMS system architecture</title>
        <desc id="lms-arch-desc">Architecture diagram showing a Vue client reaching Nginx, which routes REST traffic to the Django API and WebSocket traffic to Channels; domain services write to PostgreSQL, cache and publish through Redis, hand slow work to Celery workers, and store media in object storage.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= ZONES (painted first) ================= -->
        <!-- Zone: Django platform -->
        <rect x="440" y="104" width="488" height="432" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="628" y="108" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="684" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DJANGO PLATFORM · ASGI</text>

        <!-- Zone: Data -->
        <rect x="960" y="104" width="280" height="432" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="1064" y="108" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="1100" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DATA · STATE</text>

        <!-- ================= ARROWS (behind nodes) ================= -->
        <!-- a. SPA -> Nginx (HTTPS) -->
        <line x1="208" y1="312" x2="240" y2="312" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- b. Nginx -> REST API (/api), elbow up -->
        <path d="M 368,300 H 412 Q 420,300 420,292 V 192 Q 420,184 428,184 H 472"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- c. Nginx -> WebSocket gateway (/ws), straight -->
        <line x1="368" y1="324" x2="472" y2="324" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- d. REST API -> Domain services -->
        <line x1="648" y1="184" x2="704" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- e. Domain -> PostgreSQL (primary flow, accent) -->
        <line x1="904" y1="184" x2="984" y2="184" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- f. Domain -> Redis (cache + publish) -->
        <line x1="904" y1="296" x2="984" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- g. Redis -> WebSocket gateway (fan-out, async/dashed), with a hop over the enqueue vertical at x=792 -->
        <path d="M 1056,344 V 392 Q 1056,400 1048,400 H 800 a 8,8 0 0,0 -16,0 H 568 Q 560,400 560,392 V 344"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- h. Domain -> Celery workers (enqueue, async/dashed), vertical -->
        <line x1="792" y1="344" x2="792" y2="440" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- i. Celery -> Email / push provider (external call) -->
        <line x1="704" y1="472" x2="368" y2="472" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- j. Celery -> Object storage (certificate PDFs, exports) -->
        <line x1="904" y1="472" x2="984" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ================= ARROW LABELS ================= -->
        <!-- a -->
        <rect x="204" y="292" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="224" y="301" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>
        <!-- b: beside the vertical at x=420 -->
        <rect x="428" y="232" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="444" y="241" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/API</text>
        <!-- c: below the /ws line -->
        <rect x="384" y="332" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="398" y="341" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/WS</text>
        <!-- d -->

        <text x="676" y="173" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALL</text>

        <text x="944" y="173" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ORM</text>
        <!-- f -->
        <rect x="908" y="276" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="940" y="285" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CACHE·PUB</text>
        <!-- g: above the horizontal at y=400 -->
        <rect x="896" y="380" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="924" y="389" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAN-OUT</text>
        <!-- h: beside the vertical at x=792 -->
        <rect x="804" y="356" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="832" y="365" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENQUEUE</text>
        <!-- i -->

        <text x="944" y="461" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FILES</text>

        <text x="124" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">learner · instructor · admin</text>

        <!-- Nginx (edge) -->
        <rect x="240" y="280" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="280" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="248" y="286" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="264" y="295" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="304" y="314" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nginx</text>
        <text x="304" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TLS · static SPA</text>

        <!-- Email / push provider (external) -->
        <rect x="240" y="440" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="440" width="128" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="248" y="446" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="262" y="455" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>

        <text x="304" y="490" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SMTP provider · FCM</text>

        <!-- REST API (focal) -->
        <rect x="472" y="152" width="176" height="64" rx="6" fill="#f5f5f5"/>

        <rect x="480" y="158" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>

        <rect x="472" y="280" width="176" height="64" rx="6" fill="#f5f5f5"/>

        <text x="804" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Domain services</text>
        <line x1="720" y1="202" x2="888" y2="202" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
        <text x="720" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">learning   courses · certificates</text>
        <text x="720" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">network    profiles · connections</text>
        <text x="720" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">community  groups · posts · events</text>
        <text x="720" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">career     jobs · companies</text>

        <text x="804" y="332" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">view → service → query → model</text>
